[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financeiro-pessoal-dr"
version = "0.1.0"
description = "Aplicativo desktop local para o financeiro pessoal do Dr."
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "argon2-cffi>=23.1", "openpyxl>=3.1,<4", "reportlab>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
financeiro-pessoal-dr = "financeiro_dr.main:main"
financeiro-dr-servidor = "financeiro_dr.network.read_api:main"
financeiro-dr-criar-admin = "financeiro_dr.network.bootstrap_admin:main"
financeiro-dr-usuarios = "financeiro_dr.network.accounts_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financeiro_dr = ["database/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
